---
layout: default
---

<div class="home">
  <h1>home</h1>
  {{ content }}

  <h2>recent_posts</h2>
  <ul class="post-list">
    {% for post in site.posts %}
      <li>
        <a href="{{ post.url | relative_url }}">
          {% unless post.hide_date %}
          <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y-%m-%d" }}</time>
          {% endunless %}
          <span>{{ post.title }}</span>
        </a>
      </li>
    {% endfor %}
  </ul>
</div>
